# A small local Supabase Auth for the browser tests: Postgres, the Supabase Auth server (GoTrue),
# Mailpit to catch its emails, and nginx to serve Auth under /auth/v1 like a real project.
#   docker compose -f e2e/supabase/compose.yml up -d
# Studio settings for it are in e2e/supabase/test.env.
name: reach-auth-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['54322:5432']
    volumes: ['./init.sql:/docker-entrypoint-initdb.d/init.sql:ro']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      retries: 30
  auth:
    image: supabase/gotrue:v2.180.0
    depends_on:
      db: { condition: service_healthy }
    restart: on-failure
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:root@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3100
      GOTRUE_URI_ALLOW_LIST: http://localhost:3100/**
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_SECRET: local-test-jwt-secret-with-at-least-32-chars
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: studio@reach.test
      GOTRUE_SMTP_SENDER_NAME: Reach Studio
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
  mail:
    image: axllent/mailpit:v1.27
    ports: ['54324:8025']
  gateway:
    image: nginx:1.27-alpine
    depends_on: [auth]
    ports: ['54321:80']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
