# Writes each new video's SEO with Claude Code, signed in with your Claude plan (no API key), every 15 minutes.
# Repository secrets:
#   STUDIO_URL               e.g. https://reach-studio-five.vercel.app (shared with tick.yml)
#   CRON_SECRET              the same value as in Vercel (shared with tick.yml)
#   CLAUDE_CODE_OAUTH_TOKEN  from running `claude setup-token` on your computer
name: claude-seo
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
concurrency:
  group: claude-seo # one run at a time; a long run makes the next one wait instead of doubling up
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HELPER_STUDIO_URL: ${{ secrets.STUDIO_URL }}
      HELPER_SECRET: ${{ secrets.CRON_SECRET }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check the secrets
        run: |
          missing=""
          [ -n "$HELPER_STUDIO_URL" ] || missing="$missing STUDIO_URL"
          [ -n "$HELPER_SECRET" ] || missing="$missing CRON_SECRET"
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || missing="$missing CLAUDE_CODE_OAUTH_TOKEN"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Claude Code
        # Newer npm skips install scripts unless allowed; Claude Code's sets up its program.
        run: |
          npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code
          claude --version
      # Speech to text, so Claude knows what is said in the video. If any of this fails, Claude still gets
      # frames from the whole video and YouTube search suggestions.
      - name: Check ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-transcribe.txt
      - name: Install speech to text
        continue-on-error: true
        run: pip install -q -r scripts/requirements-transcribe.txt
      - name: Keep the speech model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Download the speech model
        continue-on-error: true
        # Hugging Face sometimes refuses busy addresses (429); try a few times.
        run: |
          for i in 1 2 3; do
            python -c "from faster_whisper import download_model; download_model('small')" && exit 0
            sleep 20
          done
          exit 1
      - name: Write SEO for waiting videos
        env:
          HELPER_PYTHON: python
        run: node scripts/claude-helper.mjs --once
